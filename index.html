<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>札幌・北海道 6天5夜</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--sky:#A8D3E6;--green:#B9DAA5;color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Huninn","PingFang TC","Noto Sans TC",sans-serif;line-height:1.6;padding-top:calc(58px + env(safe-area-inset-top,0px))}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--paper);border-bottom:3px solid var(--ink);padding:env(safe-area-inset-top,0px) 0 0}
nav{display:flex;gap:8px;overflow-x:auto;padding:9px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button,.tabs button{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:2px 14px;white-space:nowrap;cursor:pointer}
nav button:nth-child(4n+1){background:var(--coral)}nav button:nth-child(4n+2){background:var(--yellow)}nav button:nth-child(4n+3){background:var(--sky)}nav button:nth-child(4n){background:var(--green)}
nav button:active,.tabs button:active{transform:translateY(2px)}
button:focus-visible,label:focus-within{outline:3px dashed var(--ink);outline-offset:3px}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
section{margin-bottom:34px}
h2{font-size:24px;margin:0 0 12px;font-weight:400;display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:18px;padding:0 16px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:14px 16px;box-shadow:0 4px 0 var(--ink)}
.hero{background:var(--sky);padding:0;overflow:hidden}
.hero svg{display:block;width:100%;height:auto}
.title{text-align:center;margin:18px 0 12px}
.title h1{font-size:30px;line-height:1.25;margin:0;font-weight:400}
.title p{margin:4px 0 0}
.cd{display:flex;gap:10px;justify-content:center;align-items:stretch}
.cd div{flex:1;max-width:100px;text-align:center;border:3px solid var(--ink);border-radius:20px;padding:6px 0;background:var(--coral)}
.cd div:nth-child(2){background:var(--yellow)}.cd div:nth-child(3){background:var(--green)}
.cd b{display:block;font-size:30px;font-weight:400;line-height:1.2}
.cd small{font-size:13px}
.note{font-size:13px;text-align:center;margin:8px 0 0}
.fl{display:flex;flex-direction:column;gap:14px}
.fl h3{margin:0 0 6px;font-size:17px;font-weight:400}
.rt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rt div{text-align:center}.rt strong{display:block;font-size:26px;font-weight:400;line-height:1.2}
.rt svg{flex:1;max-width:90px}
.chip{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px;line-height:1.5;margin:0 6px 0 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border-radius:20px;padding:2px 12px;text-align:center;line-height:1.3}
.tabs button small{display:block;font-size:12px}
.tabs button[aria-selected=true]{background:var(--coral);transform:translateY(-2px);box-shadow:0 3px 0 var(--ink)}
.dayh{margin:6px 0 14px;font-size:20px}
ol.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px dashed var(--ink)}
ol.tl.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
ol.tl.pop li{animation:rise .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*45ms)}
li.it{position:relative;margin:0 0 14px}
li.it::before{content:"";position:absolute;left:-34px;top:12px;width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
li.it.must::before{background:var(--coral)}
li.it .card{padding:8px 12px;box-shadow:none;border-radius:20px}
.tm{font-size:14px}
.it h4{margin:0;font-size:17px;font-weight:400}
.it p{margin:2px 0 4px;font-size:14px;white-space:pre-line}
.tag{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:0 9px;font-size:12.5px;line-height:1.45;margin-right:4px}
.t-w{background:var(--green)}.t-j{background:var(--sky)}.t-b{background:var(--yellow)}.t-f,.t-c{background:var(--coral)}.t-l{background:#E7D6F0}
.must-b{display:inline-block;background:var(--coral);border:3px solid var(--ink);border-radius:999px;padding:0 8px;font-size:12px;line-height:1.4;margin-left:6px;vertical-align:2px}
.opt{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:0 8px;font-size:12px;margin-left:6px}
.ck{list-style:none;margin:0;padding:0}
.ck li{margin:0 0 8px}
.ck label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.ck input{position:absolute;opacity:0;width:0;height:0}
.ck .bx{flex:none;width:26px;height:26px;border:3px solid var(--ink);border-radius:9px;background:var(--paper);display:grid;place-items:center;margin-top:1px}
.ck .bx::after{content:"";width:12px;height:7px;border:solid var(--ink);border-width:0 0 3px 3px;transform:rotate(-45deg) scale(0) translate(1px,-1px);transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.ck input:checked+.bx{background:var(--green)}
.ck input:checked+.bx::after{transform:rotate(-45deg) scale(1) translate(1px,-1px)}
.ck input:checked~span:last-child{text-decoration:line-through;opacity:.6}
.ck input:focus-visible+.bx{outline:3px dashed var(--ink);outline-offset:3px}
.fc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fc button{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:0 14px;cursor:pointer}
.fc button[aria-pressed=true]{background:var(--yellow);box-shadow:0 3px 0 var(--ink)}
.pl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pl li{display:flex;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:20px;padding:8px 12px;background:var(--paper);animation:rise .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*30ms)}
.pl .ic{flex:none;width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:18px}
.pl .tx{flex:1;min-width:0}
.pl b{font-weight:400;font-size:16px;display:block;line-height:1.35}
.pl small{font-size:13px;display:block;line-height:1.4}
.pl a{flex:none;color:var(--ink);text-decoration:none;font-size:13px;background:var(--sky);border:3px solid var(--ink);border-radius:999px;padding:0 10px}
.sub{font-size:13px;margin:0 0 10px}
.btn{display:inline-block;font:inherit;color:var(--ink);text-decoration:none;background:var(--sky);border:3px solid var(--ink);border-radius:999px;padding:2px 16px;margin-top:6px}
footer{text-align:center;font-size:13px;padding-bottom:20px}
.f1{animation:drift 7s ease-in-out infinite alternate}
.cloud{animation:drift 9s ease-in-out infinite alternate}
.plane{animation:fly 5s ease-in-out infinite alternate}
.sun{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
.sn{animation:fall 5s linear infinite}
.sn:nth-of-type(2n){animation-duration:7s;animation-delay:-3s}.sn:nth-of-type(3n){animation-duration:6s;animation-delay:-1.5s}
.light{animation:blink 2.4s ease-in-out infinite}
.train{animation:bob 1.2s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-8px)}to{transform:translateX(10px)}}
@keyframes fly{from{transform:translate(0,4px) rotate(-3deg)}to{transform:translate(14px,-8px) rotate(2deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(190px)}}
@keyframes blink{50%{opacity:.35}}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><nav id="nav"></nav></header>
<main>

<section id="home">
  <div class="card hero">
    <svg viewBox="0 0 360 230" role="img" aria-label="札幌電視塔、雪山與飛機的插畫">
      <rect width="360" height="230" fill="#A8D3E6"/>
      <circle class="sun" cx="66" cy="56" r="22" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-dasharray="6 5"/>
      <g class="cloud"><ellipse cx="270" cy="52" rx="34" ry="13" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/><ellipse cx="288" cy="40" rx="18" ry="11" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/></g>
      <g class="cloud" style="animation-duration:12s"><ellipse cx="110" cy="100" rx="26" ry="10" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/></g>
      <g class="plane"><g transform="translate(150 36)"><path d="M-4 0L-16 -17H-7L8 0Z" fill="#F2A497" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/><ellipse rx="24" ry="9" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/><path d="M-19 -3L-28 -14H-21L-12 -3Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/><circle cx="12" cy="-1" r="2" fill="#3E3A39"/></g></g>
      <path d="M0 176Q60 118 130 160T250 150T360 160V230H0Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <path d="M240 175L282 128L330 175Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <path d="M270 140L282 128L296 142L284 148Z" fill="#FFFCF6"/>
      <path d="M0 196Q90 176 180 192T360 186V230H0Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/>
      <line x1="180" y1="62" x2="180" y2="78" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
      <path d="M170 196L176 96H184L190 196Z" fill="#F2A497" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <rect x="164" y="78" width="32" height="20" rx="6" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
      <circle class="light" cx="172" cy="88" r="3" fill="#3E3A39"/><circle class="light" cx="180" cy="88" r="3" fill="#3E3A39"/><circle class="light" cx="188" cy="88" r="3" fill="#3E3A39"/>
      <path d="M62 190L82 150L102 190Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <path d="M76 192L92 162L108 192Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <path d="M300 196L316 166L332 196Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#FFFCF6" stroke="#3E3A39" stroke-width="2">
        <circle class="sn" cx="30" cy="20" r="4"/><circle class="sn" cx="95" cy="10" r="3.5"/><circle class="sn" cx="210" cy="14" r="4"/><circle class="sn" cx="250" cy="6" r="3"/><circle class="sn" cx="322" cy="18" r="4"/><circle class="sn" cx="140" cy="0" r="3"/>
      </g>
    </svg>
  </div>
  <div class="title">
    <h1>札幌・北海道<br>6天5夜雪遊記</h1>
    <p id="range">&nbsp;</p>
  </div>
  <div class="cd" id="cd" aria-live="polite"></div>
  <p class="note" id="cdnote"></p>
</section>

<section id="flight">
  <h2>航班</h2>
  <div class="fl">
    <div class="card">
      <h3><span class="chip" style="background:#F2A497">去程</span>中華航空 CI130 <span id="fd1"></span></h3>
      <div class="rt">
        <div><strong>08:35</strong>桃園 TPE</div>
        <svg viewBox="0 0 90 30" aria-hidden="true"><line x1="2" y1="15" x2="88" y2="15" stroke="#3E3A39" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/><g class="f1"><ellipse cx="45" cy="13" rx="14" ry="6" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/><path d="M42 13L36 3H42L50 13Z" fill="#F2A497" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/></g></svg>
        <div><strong>13:20</strong>新千歲 CTS</div>
      </div>
      <p class="sub" style="margin:8px 0 0">建議提早到機場領機票、托運行李、過海關、登機。</p>
    </div>
    <div class="card">
      <h3><span class="chip" style="background:#A8D3E6">回程</span>中華航空 CI1
